[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctgov"
version = "0.1.0"
description = "Paginating ClinicalTrials.gov API v2 client with free-text endpoint normalization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GooseWithTheStories", email = "storytime.goose@gmail.com" }]
keywords = [
    "clinicaltrials",
    "clinicaltrials.gov",
    "clinical-trials",
    "pagination",
    "endpoints",
    "outcome-measures",
    "biomedical",
    "healthcare",
    "HEOR",
    "systematic-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
# Deliberately zero runtime dependencies: stdlib only. Installing a clinical-data helper
# should not drag in a dependency tree.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/GooseWithTheStories/ctgov"
Issues = "https://github.com/GooseWithTheStories/ctgov/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ctgov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live ClinicalTrials.gov API"]
